<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SecureLife Insurance - Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 360px; }
        h2 { color: #004d40; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #004d40; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00332c; }
        .info { background: #e0f2f1; padding: 10px; border-radius: 6px; font-size: 12px; color: #004d40; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>SecureLife Insurance</h2>
    <div class="info">
        <strong>Your Credentials:</strong><br>
        Username: <code>sakthi</code><br>
        Password: <code>aws@123</code>
    </div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="sakthi">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="aws@123">
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
